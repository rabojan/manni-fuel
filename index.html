<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1d1b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Manni Fuel 2.0</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="welcomeScreen" class="welcome-screen" aria-label="Dobrodošli v Manni's World — Breda & Bojan">
    <img class="welcome-image" src="manni-world-splash.png" alt="Dobrodošli v Manni's World — Breda & Bojan" />
    <div class="welcome-skip">Dotakni se za preskok</div>
  </div>

  <div id="app">
    <div id="map" aria-label="Zemljevid bencinskih črpalk"></div>

    <div class="top-controls">
      <button id="locateBtn" class="floating-btn icon-only" aria-label="Moja lokacija">➤</button>
      <div class="control-pill">
        <button id="refreshBtn" class="pill-action" aria-label="Osveži">↻</button>
        <div class="pill-value" id="bestPrice">—</div>
        <div class="pill-divider"></div>
        <button id="fuelBtn" class="pill-select">Diesel <span>⌄</span></button>
        <div class="pill-divider"></div>
        <button id="settingsBtn" class="pill-more" aria-label="Nastavitve">•••</button>
      </div>
    </div>

    <button id="searchAreaBtn" class="search-area-btn hidden">⛽ Poišči na tem območju</button>

    <section id="sheet" class="bottom-sheet sheet-half" aria-label="Bencinske črpalke">
      <div id="sheetHandle" class="sheet-handle-wrap" aria-label="Povleci seznam">
        <div class="sheet-handle"></div>
      </div>

      <div class="sheet-tools">
        <button id="etaBtn" class="eta-btn" type="button" disabled title="ETA bomo dodali v naslednji fazi">
          ◴ <span>Calculate ETAs</span><small>kmalu</small>
        </button>
      </div>

      <div class="sheet-head">
        <div>
          <h1>Fuel stations</h1>
          <p id="updatedText">Nalagam podatke …</p>
        </div>
        <div class="sort-wrap">
          <label for="sortSelect">Sort</label>
          <select id="sortSelect">
            <option value="price">By price</option>
            <option value="distance">By distance</option>
          </select>
        </div>
      </div>

      <div id="statusBar" class="status-bar">Pridobivam tvojo lokacijo …</div>
      <div id="stationList" class="station-list" aria-live="polite"></div>
    </section>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card">
        <div class="settings-head">
          <div>
            <span class="eyebrow">Manni Fuel 2.0</span>
            <h2>Nastavitve</h2>
          </div>
          <button value="cancel" class="close-btn" aria-label="Zapri">✕</button>
        </div>

        <label class="field">
          <span>Iskalni radij</span>
          <select id="radiusSelect">
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="20" selected>20 km</option>
            <option value="30">30 km</option>
            <option value="50">50 km</option>
          </select>
        </label>

        <label class="field">
          <span>Gorivo</span>
          <select id="fuelSelect">
            <option value="B7" selected>Diesel B7</option>
          </select>
        </label>

        <label class="field">
          <span>Manni API — Cloudflare Worker</span>
          <input id="apiBaseInput" type="url" placeholder="https://manni-fuel-api....workers.dev" autocomplete="off" />
          <small>Za hitro delovanje je priporočljiv tvoj Worker. Brez njega aplikacija uporabi neposredni Pumperly z zelo kratkim timeoutom.</small>
        </label>

        <div class="info-box">
          <strong>Hitri način</strong>
          <span>Worker uporablja Cloudflare cache in iste geografske celice ponovno servira takoj.</span>
        </div>

        <button id="saveSettingsBtn" value="default" class="save-btn">Shrani</button>
      </form>
    </dialog>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
