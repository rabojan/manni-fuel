<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f47a18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Manni's World — Fuel</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="styles.css?v=3.2.0" />
</head>
<body>
  <div id="welcomeScreen" class="welcome-screen" aria-label="Dobrodošli v Manni's World — Breda & Bojan">
    <img class="welcome-image" src="manni-world-splash.png" alt="Dobrodošli v Manni's World — Breda & Bojan" />
    <div class="welcome-skip">Dotakni se za preskok</div>
  </div>

  <div id="app">
    <div id="map" aria-label="Zemljevid bencinskih črpalk"></div>

    <header class="brand-header">
      <div class="brand-title"><span class="camper-mark">🚐</span><span>Manni's World</span></div>
      <div class="header-actions">
        <button id="routeBtn" class="header-btn route-header-btn" aria-label="Pot">⌁</button>
        <button id="settingsBtn" class="header-btn" aria-label="Nastavitve">⚙︎</button>
      </div>
    </header>

    <div class="top-controls">
      <button id="refreshBtn" class="filter-chip refresh-chip" aria-label="Osveži">↻</button>
      <div class="filter-chip fuel-chip" aria-label="Gorivo: Diesel">⛽ Diesel</div>
      <div class="filter-chip price-chip"><span class="chip-label">Najnižja</span><strong id="bestPrice">—</strong></div>
      <div class="filter-chip sort-chip">
        <select id="sortSelect" aria-label="Razvrsti">
          <option value="price">Najcenejše</option>
          <option value="distance">Najbližje</option>
        </select>
      </div>
    </div>

    <button id="locateBtn" class="floating-btn" aria-label="Moja lokacija">➤</button>

    <section id="sheet" class="bottom-sheet sheet-low" aria-label="Bencinske črpalke">
      <div id="sheetDragZone" class="sheet-drag-zone" aria-label="Povleci seznam">
        <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
        <div class="sheet-head">
        <div>
          <h1>Bencinske črpalke</h1>
          <p id="updatedText">Nalagam podatke …</p>
        </div>
        <button id="sheetToggle" class="sheet-hint" type="button" onclick="window.manniToggleSheet && window.manniToggleSheet()">Prikaži seznam ↑</button>
        </div>
      </div>

      <div id="statusBar" class="status-bar">Pridobivam tvojo lokacijo …</div>
      <div id="stationList" class="station-list" aria-live="polite"></div>
    </section>

    <div id="routeBadge" class="route-badge" hidden></div>

    <dialog id="routeDialog">
      <form method="dialog" class="settings-card route-card" onsubmit="return false">
        <div class="settings-head">
          <div>
            <span class="eyebrow">Manni's World</span>
            <h2>Pot</h2>
          </div>
          <button id="routeCloseBtn" type="button" class="close-btn" aria-label="Zapri">✕</button>
        </div>
        <div class="route-start"><span>Začetek</span><strong>📍 Moja trenutna lokacija</strong></div>
        <label class="field">
          <span>Cilj</span>
          <input id="routeDestination" type="text" autocomplete="off" placeholder="npr. Tallinn" />
        </label>
        <div class="route-section-head"><div><strong>Pot preko</strong><small>Groba smer poti — ni nujno, da se tam ustaviš.</small></div><button id="addViaBtn" type="button" class="mini-add-btn">+ Dodaj</button></div>
        <div id="routeViaList" class="route-via-list"></div>
        <div id="routeSummary" class="route-summary">Pot še ni nastavljena.</div>
        <div class="route-actions"><button id="clearRouteBtn" type="button" class="secondary-btn">Počisti</button><button id="saveRouteBtn" type="button" class="save-btn">Shrani pot</button></div>
      </form>
    </dialog>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card">
        <div class="settings-head">
          <div>
            <span class="eyebrow">Manni's World</span>
            <h2>Nastavitve</h2>
          </div>
          <button value="cancel" class="close-btn" aria-label="Zapri">✕</button>
        </div>

        <label class="field">
          <span>Iskalni radij</span>
          <select id="radiusSelect">
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="20" selected>20 km</option>
            <option value="30">30 km</option>
            <option value="50">50 km</option>
          </select>
        </label>

        <label class="field">
          <span>Gorivo</span>
          <select id="fuelSelect">
            <option value="B7" selected>Diesel B7</option>
          </select>
        </label>

        <label class="field">
          <span>Manni API — Cloudflare Worker</span>
          <input id="apiBaseInput" type="url" autocomplete="off" />
          <small>Worker je že nastavljen kot privzeti vir, zato aplikacija deluje enako na telefonu in računalniku.</small>
        </label>

        <button id="saveSettingsBtn" value="default" class="save-btn">Shrani</button>
      </form>
    </dialog>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
  // Development cache reset: always load the newest Manni Fuel UI.
  (async function(){
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch(e) { console.warn('Cache reset', e); }
  })();
</script>
<script src="storage.js?v=3.2.0"></script>
<script src="route.js?v=3.2.0"></script>
<script src="app.js?v=3.2.0"></script>
</body>
</html>
